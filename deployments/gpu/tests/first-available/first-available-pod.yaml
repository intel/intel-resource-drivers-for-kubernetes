apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: first-available-claim
  namespace: intel-gpu-resource-driver
spec:
  spec:
    devices:
      requests:
      # Prioritized list: the first subrequest cannot be satisfied by any GPU,
      # so the scheduler has to fall back to the second one. This makes the
      # allocation result refer to the subrequest with the
      # "<request>/<subrequest>" request name, instead of just "<request>".
      - name: accelerator
        firstAvailable:
        # 'model' attribute is always announced, so the expression is always
        # evaluatable (unlike e.g. optional 'memory' capacity), and never true.
        - name: impossible-gpu
          deviceClassName: gpu.intel.com
          selectors:
          - cel:
              expression: device.attributes["gpu.intel.com"].model == "NoSuchGpuModel"
        - name: any-gpu
          deviceClassName: gpu.intel.com
---
apiVersion: v1
kind: Pod
metadata:
  name: first-available-test
  namespace: intel-gpu-resource-driver
spec:
  restartPolicy: Never
  containers:
  - name: with-resource
    image: registry.k8s.io/e2e-test-images/busybox:1.29-2
    command: ["sh", "-c", "echo 'Testing firstAvailable (prioritized list) GPU request' && ls -la /dev/dri/ && CARD_COUNT=$(ls -1 /dev/dri/card* 2>/dev/null | wc -l) && RENDER_COUNT=$(ls -1 /dev/dri/renderD[12][0-9][0-9] 2>/dev/null | wc -l) && echo \"Found $CARD_COUNT card device(s) and $RENDER_COUNT render device(s)\" && test $CARD_COUNT -eq 1 && test $RENDER_COUNT -eq 1 && echo 'SUCCESS: GPU allocated'"]
    resources:
      claims:
      - name: resource
  resourceClaims:
  - name: resource
    resourceClaimTemplateName: first-available-claim
